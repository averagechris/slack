[package]
name = "slack"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
default-run = "slack"
authors = ["Chris <chris@thesogu.com>"]
description = "A Slack CLI with OAuth authentication, profile management, and API access"
license = "MIT OR Apache-2.0"
repository = "https://github.com/averagechris/slack"
homepage = "https://averagechris.github.io/slack/"
readme = "README.md"
keywords = ["slack", "cli", "oauth", "api", "workspace"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "slack"
path = "src/main.rs"

[lib]
name = "slack"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
directories = "6.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
base64 = "0.23"
sha2 = "0.10"
rand = "0.8"
url = "2.5"
argon2 = "0.5"
aes-gcm = "0.10"
rpassword = "7.3"
regex = "1.11"
arboard = "3.4"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"

# OS keyring token storage (R1/D2: keyring-only, no plaintext files).
# Platform backends: macOS Keychain, Windows Credential Manager, and Linux
# Secret Service via zbus with pure-Rust crypto (no OpenSSL) so nix builds
# stay simple.
[dependencies.keyring]
version = "3"
features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
]

[dev-dependencies]
tempfile = "3.14"
wiremock = "0.6"
httpmock = "0.8"
serial_test = "3.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "abort"
